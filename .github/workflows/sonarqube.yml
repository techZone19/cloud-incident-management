name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up .NET 11
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Authenticate with SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth

      - name: Build, test and analyze
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ steps.auth.outputs.sonar-token }}
        run: |
          dotnet sonarscanner begin /k:"techZone19_cloud-incident-management" /o:"techzone19" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build CloudIncidentManagement.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet test CloudIncidentManagement.slnx --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }